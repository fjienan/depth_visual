# 数据集划分配置
# 用于 split.dataset.py 脚本
# 将数据集划分为 train / val / test

# ==================== 输入输出配置 ====================
io:
  # 源数据集目录（YOLO 格式：images/ 和 labels/）
  source_dir: "../KFS-1_yolo_obb"
  
  # 输出目录（默认: <source_dir>_split）
  # 留空表示使用默认命名
  output_dir: null

# ==================== 划分比例 ====================
split_ratio:
  # 训练集比例
  train: 0.8
  
  # 验证集比例
  val: 0.15
  
  # 测试集比例
  test: 0.05

# ==================== 处理选项 ====================
processing:
  # 是否移动文件而不是复制
  # true: 移动文件（原目录会被清空）
  # false: 复制文件（原目录保留）
  move: false
  
  # 随机种子（保证可重复性）
  seed: 42
  
  # 是否打乱数据
  shuffle: true

# ==================== 输出结构 ====================
# output_dir/
#   ├── images/
#   │   ├── train/  (80%)
#   │   ├── val/    (15%)
#   │   └── test/   (5%)
#   └── labels/
#       ├── train/
#       ├── val/
#       └── test/

# ==================== 使用建议 ====================
# 1. 标准划分（推荐）
#    train: 0.8, val: 0.15, test: 0.05
#
# 2. 数据量很少时
#    train: 0.85, val: 0.15, test: 0.0
#    （不留测试集，用验证集评估）
#
# 3. 数据量很多时
#    train: 0.7, val: 0.2, test: 0.1
#    （增大验证集，更准确评估）

# ==================== 注意事项 ====================
# 1. 确保源目录结构正确：
#    source_dir/
#      ├── images/  (所有图片)
#      └── labels/  (对应标签)
#
# 2. 验证集不能太小
#    - 建议至少 500 张
#    - 否则验证指标不稳定
#
# 3. 测试集用于最终评估
#    - 训练过程中不要使用
#    - 只在模型完全训练好后评估一次
#
# 4. 划分后检查类别分布
#    - 确保每个类别在 train/val/test 中都有样本
#    - 避免某个类别只出现在一个子集中
