# Stage 2 数据准备配置
# 用于 prepare_stage2_data.py 脚本
# 从 Stage 1 (OBB) 数据生成 Stage 2 (Pose) 训练数据

# ==================== 输入输出配置 ====================
io:
  # 源数据集目录（YOLO-OBB 或 Pose 格式，包含 4 个角点）
  source_dir: "../KFS-1_yolo_obb"
  
  # 输出目录（默认: stage2_<source_dir_name>）
  # 留空表示使用默认命名
  output_dir: null

# ==================== 裁剪配置 ====================
crop:
  # 裁剪尺寸 (width, height)
  # 应与训练时的 imgsz 一致
  # 建议：目标是正方形 → [256, 256]
  #      目标是长条形 → [256, 128]
  width: 256
  height: 256

# ==================== 数据增强 ====================
augmentation:
  # 每个对象生成的变化数
  # 355张原图 × 10变化 = 3,550张训练图
  # 推荐值：10-20
  num_variations: 10
  
  # 随机种子（保证可重复性）
  seed: 42

# ==================== 抖动参数（模拟 Stage 1 误差）====================
jitter:
  # 中心位置抖动比例（相对于 OBB 尺寸）
  # 0.05 = ±5% 的中心偏移
  center_jitter: 0.05
  
  # OBB 尺寸缩放范围
  # [1.1, 1.3] 表示放大 10%-30%
  # 目的：确保真实角点在裁剪范围内
  size_scale_min: 1.1
  size_scale_max: 1.3
  
  # 角度抖动（度）
  # ±5° 的角度偏移
  angle_jitter: 5.0

# ==================== 质量控制 ====================
quality:
  # 关键点边界容差（允许点超出裁剪框的比例）
  # 0.15 = 允许 ±15% 超出
  # 超出此范围的样本会被丢弃
  keypoint_margin: 0.15

# ==================== 使用场景建议 ====================
# 场景1: 快速验证（数据量较小）
# num_variations: 8
# center_jitter: 0.03
# size_scale: [1.1, 1.25]
# → 355 × 8 = 2,840 张
#
# 场景2: 生产环境（推荐）
# num_variations: 15
# center_jitter: 0.08
# size_scale: [1.05, 1.35]
# → 355 × 15 = 5,325 张
#
# 场景3: 高精度要求
# num_variations: 20
# center_jitter: 0.1
# size_scale: [1.0, 1.4]
# → 355 × 20 = 7,100 张

# ==================== 注意事项 ====================
# 1. crop_size 应该与目标的长宽比匹配
#    - 正方形目标 → [256, 256]
#    - 2:1 长条目标 → [256, 128]
#
# 2. size_scale_range 不要太大
#    - 太大会导致很多样本被丢弃（角点超出边界）
#    - 推荐 [1.05, 1.35]
#
# 3. num_variations 不是越多越好
#    - 取决于原始数据的场景多样性
#    - 如果原图多样性不足，增加变化数意义不大
#
# 4. 生成后记得划分训练/验证集
#    python split.dataset.py --source <output_dir>
