# Stage 1: OBB 模型训练配置
# 用于训练 YOLOv8-OBB 模型进行粗定位

# ==================== 模型配置 ====================
model:
  # OBB 模型路径或名称
  # 可以是: yolov8n-obb.pt, yolov8s-obb.pt, yolov8m-obb.pt 等
  path: "yolov8n-obb.pt"
  pretrained: true

# ==================== 数据配置 ====================
data:
  # 数据配置文件路径（YAML格式）
  # 应包含: train, val, test路径，类别数量(nc)，类别名称(names)
  config: "./config/data_1.yaml"
  
  # 输入图像尺寸
  imgsz: 640
  
  # 批次大小
  batch: 32
  
  # 工作进程数
  workers: 8

  # ==================== 数据增强 ====================
  augmentation:
    # HSV 增强
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    
    # 几何变换
    degrees: 5.0      # 旋转角度
    translate: 0.1     # 平移
    scale: 0.5         # 缩放
    shear: 0.0         # 剪切
    perspective: 0.0   # 透视
    flipud: 0.0        # 上下翻转
    fliplr: 0.5        # 左右翻转
    
    # 其他增强
    mosaic: 1.0
    mixup: 0.0
    copy_paste: 0.0

# ==================== 训练参数 ====================
training:
  # 训练轮数
  epochs: 300
  
  # 优化器
  optimizer: SGD
  
  # 学习率
  lr0: 0.01
  lrf: 0.01
  
  # 动量
  momentum: 0.937
  
  # 权重衰减
  weight_decay: 0.0005
  
  # 预热
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  
  # 早停
  patience: 50

# ==================== 输出配置 ====================
output:
  project: "../output"
  name: "stage1_obb"
  # 自动命名：按“数据集文件夹名 + 数据集规模”命名输出目录
  # 例：stage1_obb__KFS-1_obb_augmented_split_n2130
  auto_name: true
  name_template: "{stage}__{dataset}_n{n}"
  exist_ok: true

# ==================== 设备配置 ====================
device:
  device: "0"  # GPU设备，或 "cpu"

# ==================== 其他配置 ====================
misc:
  seed: 42
  verbose: true
